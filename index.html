<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkBlock</title>

    <!-- Google Fonts / Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: black;
            font-family: serif;
        }


        /* =========================
           ヘッダー
           ========================= */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 40px 45px 0 45px;
        }

        h1 {
            margin: 0;

            font-size: 52px;
            font-weight: normal;

            text-decoration: underline;
        }

        .header-buttons {
            display: flex;
            gap: 15px;
        }

        .header-buttons button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 35px;
            height: 35px;

            border: none;
            background: none;

            color: black;

            cursor: pointer;
        }


        /* =========================
           Google Fonts アイコン
           ========================= */

        .material-symbols-rounded {
            font-family: "Material Symbols Rounded";

            font-weight: normal;
            font-style: normal;

            font-size: 32px;

            line-height: 1;

            letter-spacing: normal;
            text-transform: none;

            display: inline-block;
            white-space: nowrap;

            word-wrap: normal;
            direction: ltr;

            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
        }


        /* =========================
           メイン
           ========================= */

        main {
            padding: 15px 45px;
        }


        /* =========================
           Google検索
           ========================= */

        .search {
            display: flex;

            width: 230px;
            height: 36px;
        }

        .search button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 38px;

            border: none;
            border-radius: 9px 0 0 9px;

            background: black;
            color: white;

            cursor: pointer;
        }

        .search button .material-symbols-rounded {
            font-size: 27px;
        }

        .search input {
            width: 192px;

            border: none;
            border-radius: 0 9px 9px 0;

            background: #999;

            padding: 0 12px;

            font-family: sans-serif;
            font-size: 14px;

            outline: none;
        }

        .search input::placeholder {
            color: black;
        }


        /* =========================
           リンク一覧
           ========================= */

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;

            margin-top: 190px;
        }


        /* =========================
           リンクブロック
           ========================= */

        .link {
            position: relative;

            width: 130px;
            height: 130px;

            border-radius: 23px;

            background: #999;

            display: flex;
            justify-content: center;
            align-items: center;

            text-decoration: none;
            color: black;

            font-size: 19px;
        }

        .link:hover {
            background: #888;
        }


        /* =========================
           削除ボタン
           ========================= */

        .delete-button {
            display: none;

            position: absolute;

            top: -10px;
            right: -10px;

            width: 28px;
            height: 28px;

            border: none;
            border-radius: 50%;

            background: black;
            color: white;

            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .delete-button .material-symbols-rounded {
            font-size: 19px;
        }

        .edit-mode .delete-button {
            display: flex;
        }


        /* =========================
           追加画面
           ========================= */

        .window {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(255, 255, 255, 0.9);

            justify-content: center;
            align-items: center;
        }

        .window.show {
            display: flex;
        }

        .window-box {
            width: 320px;

            padding: 25px;

            border: 2px solid black;
            border-radius: 15px;

            background: white;
        }

        .window-box h2 {
            margin-top: 0;

            font-size: 22px;
            font-weight: normal;
        }

        .window-box input {
            width: 100%;

            margin-bottom: 12px;
            padding: 10px;

            border: 1px solid #999;
            border-radius: 5px;

            font-size: 15px;
        }

        .window-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;

            margin-top: 10px;
        }

        .window-buttons button {
            padding: 8px 15px;

            border: 1px solid #777;
            border-radius: 5px;

            background: white;

            cursor: pointer;
        }
    </style>
</head>


<body>

    <header>

        <h1>LinkBlock</h1>

        <div class="header-buttons">

            <!-- 編集 -->
            <button id="editButton" title="編集">
                <span class="material-symbols-rounded">
                    edit
                </span>
            </button>

            <!-- 追加 -->
            <button id="addButton" title="追加">
                <span class="material-symbols-rounded">
                    add
                </span>
            </button>

        </div>

    </header>


    <main>

        <!-- Google検索 -->

        <form
            class="search"
            action="https://www.google.com/search"
            method="get"
            target="_blank"
        >

            <button type="submit">

                <span class="material-symbols-rounded">
                    search
                </span>

            </button>

            <input
                type="text"
                name="q"
                placeholder="Google検索"
            >

        </form>


        <!-- ブックマーク -->

        <div id="links" class="links"></div>

    </main>


    <!-- ブックマーク追加画面 -->

    <div id="addWindow" class="window">

        <div class="window-box">

            <h2>ブックマークを追加</h2>

            <input
                id="linkName"
                type="text"
                placeholder="名前"
            >

            <input
                id="linkUrl"
                type="url"
                placeholder="URL"
            >

            <div class="window-buttons">

                <button id="cancelButton">
                    キャンセル
                </button>

                <button id="saveButton">
                    追加
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================
           要素
           ========================= */

        const linksElement =
            document.getElementById("links");

        const editButton =
            document.getElementById("editButton");

        const addButton =
            document.getElementById("addButton");

        const addWindow =
            document.getElementById("addWindow");

        const linkName =
            document.getElementById("linkName");

        const linkUrl =
            document.getElementById("linkUrl");

        const saveButton =
            document.getElementById("saveButton");

        const cancelButton =
            document.getElementById("cancelButton");


        let editMode = false;


        /* =========================
           ブックマーク
           ========================= */

        let links = JSON.parse(
            localStorage.getItem("linkblock-links")
        ) || [

            {
                name: "Google",
                url: "https://www.google.com/"
            },

            {
                name: "Youtube",
                url: "https://www.youtube.com/"
            }

        ];


        /* =========================
           表示
           ========================= */

        function displayLinks() {

            linksElement.innerHTML = "";


            links.forEach(function(item, index) {

                const link =
                    document.createElement("a");

                link.className = "link";

                link.href = item.url;

                link.target = "_blank";

                link.textContent = item.name;


                /* 削除ボタン */

                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete-button";


                /* Google Fonts アイコン */

                const icon =
                    document.createElement("span");

                icon.className =
                    "material-symbols-rounded";

                icon.textContent = "close";


                deleteButton.appendChild(icon);


                deleteButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();
                        event.stopPropagation();

                        deleteLink(index);

                    }
                );


                link.appendChild(deleteButton);

                linksElement.appendChild(link);

            });

        }


        /* =========================
           保存
           ========================= */

        function saveLinks() {

            localStorage.setItem(
                "linkblock-links",
                JSON.stringify(links)
            );

        }


        /* =========================
           削除
           ========================= */

        function deleteLink(index) {

            const result = confirm(
                "このブックマークを削除しますか？"
            );


            if (!result) {
                return;
            }


            links.splice(index, 1);

            saveLinks();

            displayLinks();

        }


        /* =========================
           編集モード
           ========================= */

        editButton.addEventListener(
            "click",
            function() {

                editMode = !editMode;

                document.body.classList.toggle(
                    "edit-mode",
                    editMode
                );

            }
        );


        /* =========================
           追加画面
           ========================= */

        addButton.addEventListener(
            "click",
            function() {

                addWindow.classList.add("show");

                linkName.value = "";
                linkUrl.value = "";

                linkName.focus();

            }
        );


        /* =========================
           キャンセル
           ========================= */

        cancelButton.addEventListener(
            "click",
            function() {

                addWindow.classList.remove("show");

            }
        );


        /* =========================
           追加
           ========================= */

        saveButton.addEventListener(
            "click",
            function() {

                const name =
                    linkName.value.trim();

                const url =
                    linkUrl.value.trim();


                if (name === "" || url === "") {

                    alert(
                        "名前とURLを入力してください。"
                    );

                    return;

                }


                links.push({

                    name: name,
                    url: url

                });


                saveLinks();

                displayLinks();

                addWindow.classList.remove("show");

            }
        );


        /* =========================
           起動
           ========================= */

        displayLinks();

    </script>

</body>

</html>
